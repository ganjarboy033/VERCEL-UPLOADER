<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KRUZENLAB • Vercel ZIP & HTML Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6">
  <main class="max-w-lg w-full mx-auto space-y-5 my-auto">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold mb-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          KRUZENLAB DEPLOYER
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Vercel ZIP Uploader</h1>
        <p class="text-xs text-zinc-400 mt-0.5">Deploy arsip ZIP atau file HTML langsung ke Vercel dari HP</p>
      </div>
    </div>

    <!-- Main Form Card -->
    <div class="glass rounded-2xl p-5 space-y-4 shadow-2xl">
      <!-- Token Input -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-semibold text-zinc-300">Vercel Access Token <span class="text-rose-400">*</span></label>
          <a href="https://vercel.com/account/settings/tokens" target="_blank" class="text-[11px] text-sky-400 hover:underline">Buat Token ↗</a>
        </div>
        <div class="relative flex items-center">
          <input id="tokenInput" type="password" placeholder="vcp_xxxxxxxxxxxxxxxxxxxxxxxx"
            class="w-full bg-zinc-950/90 border border-zinc-800 focus:border-sky-500 rounded-xl px-3.5 py-2.5 pr-20 text-sm mono text-white placeholder-zinc-600 outline-none transition" />
          <button type="button" id="toggleTokenBtn"
            class="absolute right-2 px-2.5 py-1 text-xs font-medium text-zinc-400 hover:text-white bg-zinc-900 rounded-lg border border-zinc-800">
            Lihat
          </button>
        </div>
        <label class="inline-flex items-center gap-2 mt-2 cursor-pointer select-none">
          <input id="saveTokenCheck" type="checkbox" checked class="rounded bg-zinc-900 border-zinc-700 text-sky-500 focus:ring-0" />
          <span class="text-[11px] text-zinc-400">Simpan token di browser perangkat ini</span>
        </label>
      </div>

      <!-- Project Name & Team ID -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Nama Project</label>
          <input id="projectInput" type="text" placeholder="contoh: web-kruzen"
            class="w-full bg-zinc-950/90 border border-zinc-800 focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 outline-none transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Team ID <span class="text-zinc-500 font-normal">(Opsional)</span></label>
          <input id="teamInput" type="text" placeholder="team_xxxxxxx"
            class="w-full bg-zinc-950/90 border border-zinc-800 focus:border-sky-500 rounded-xl px-3.5 py-2.5 text-sm mono text-white placeholder-zinc-600 outline-none transition" />
        </div>
      </div>

      <!-- File Dropzone -->
      <div>
        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">File Website (.ZIP atau .HTML) <span class="text-rose-400">*</span></label>
        <label id="dropZone" for="fileInput"
          class="flex flex-col items-center justify-center border-2 border-dashed border-zinc-800 hover:border-sky-500/60 bg-zinc-950/60 rounded-xl p-5 cursor-pointer transition text-center">
          <svg class="w-8 h-8 text-sky-400 mb-2" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
          </svg>
          <span id="fileLabel" class="text-sm font-semibold text-zinc-200">Tap untuk pilih file .ZIP atau .HTML</span>
          <span id="fileMeta" class="text-[11px] text-zinc-500 mt-1">Otomatis merapikan folder & mendeteksi index.html</span>
          <input id="fileInput" type="file" accept=".zip,.html,.htm,application/zip" class="hidden" />
        </label>
      </div>

      <!-- Production Toggle -->
      <div class="flex items-center justify-between pt-1">
        <div>
          <p class="text-xs font-semibold text-zinc-200">Deploy ke Production</p>
          <p class="text-[11px] text-zinc-500">Aktifkan domain utama project (.vercel.app)</p>
        </div>
        <input id="prodCheck" type="checkbox" checked class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-sky-500" />
      </div>

      <!-- Submit Button -->
      <button id="deployBtn" type="button"
        class="w-full py-3 px-4 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-[0.99] text-zinc-950 font-bold text-sm transition shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
        <span>🚀 Deploy Sekarang</span>
      </button>
    </div>

    <!-- Status / Result Box -->
    <div id="statusBox" class="hidden glass rounded-2xl p-4 space-y-2.5 text-xs"></div>
  </main>

  <footer class="text-center text-[11px] text-zinc-600 pt-6">
    KRUZENLAB • DEV BAGJA — Vercel REST API Deployer
  </footer>

  <script>
    const tokenInput = document.getElementById('tokenInput');
    const toggleTokenBtn = document.getElementById('toggleTokenBtn');
    const saveTokenCheck = document.getElementById('saveTokenCheck');
    const projectInput = document.getElementById('projectInput');
    const teamInput = document.getElementById('teamInput');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const fileMeta = document.getElementById('fileMeta');
    const prodCheck = document.getElementById('prodCheck');
    const deployBtn = document.getElementById('deployBtn');
    const statusBox = document.getElementById('statusBox');

    // Load saved token
    const savedToken = localStorage.getItem('kruzen_vercel_token');
    if (savedToken) tokenInput.value = savedToken;

    toggleTokenBtn.addEventListener('click', () => {
      const isPass = tokenInput.type === 'password';
      tokenInput.type = isPass ? 'text' : 'password';
      toggleTokenBtn.textContent = isPass ? 'Sembunyi' : 'Lihat';
    });

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) return;
      fileLabel.textContent = f.name;
      fileMeta.textContent = `${(f.size / 1024).toFixed(1)} KB • Siap di-deploy`;
      if (!projectInput.value.trim()) {
        projectInput.value = f.name.replace(/\.(zip|html?)$/i, '').toLowerCase().replace(/[^a-z0-9-]+/g, '-');
      }
    });

    function showStatus(html, type = 'info') {
      statusBox.classList.remove('hidden', 'border-rose-500/40', 'border-emerald-500/40', 'border-sky-500/40');
      if (type === 'error') statusBox.classList.add('border-rose-500/40');
      else if (type === 'success') statusBox.classList.add('border-emerald-500/40');
      else statusBox.classList.add('border-sky-500/40');
      statusBox.innerHTML = html;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = String(reader.result || '');
          const base64 = res.includes(',') ? res.split(',')[1] : res;
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    deployBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      const file = fileInput.files[0];
      const projectName = projectInput.value.trim();
      const teamId = teamInput.value.trim();

      if (!token) {
        return showStatus('<p class="text-rose-400 font-semibold">❌ Masukkan Vercel Access Token terlebih dahulu.</p>', 'error');
      }
      if (!file) {
        return showStatus('<p class="text-rose-400 font-semibold">❌ Pilih file .ZIP atau .HTML terlebih dahulu.</p>', 'error');
      }

      if (saveTokenCheck.checked) {
        localStorage.setItem('kruzen_vercel_token', token);
      } else {
        localStorage.removeItem('kruzen_vercel_token');
      }

      deployBtn.disabled = true;
      deployBtn.innerHTML = '<span class="animate-spin">⏳</span><span>Mengekstrak & Mengunggah...</span>';
      showStatus('<p class="text-sky-400 font-medium">⏳ Sedang memproses file dan mengunggah ke Vercel API...</p>', 'info');

      try {
        const fileBase64 = await fileToBase64(file);
        const res = await fetch('/api/deploy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            teamId,
            projectName,
            fileName: file.name,
            fileBase64,
            production: prodCheck.checked
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Deployment gagal.');
        }

        const warnHtml = !data.hasIndexHtml
          ? '<p class="text-amber-400 mt-1">⚠️ Peringatan: Tidak ditemukan <code>index.html</code> di root ZIP. Halaman utama mungkin 404.</p>'
          : '';

        showStatus(`
          <div class="space-y-2">
            <p class="text-emerald-400 font-bold text-sm">✅ Deployment Berhasil Dibuat!</p>
            <div class="bg-zinc-950/90 rounded-xl p-3 space-y-1.5 border border-zinc-800/80">
              <p><span class="text-zinc-400">Akun:</span> <span class="text-white font-semibold">${data.account}</span></p>
              <p><span class="text-zinc-400">Project:</span> <span class="text-white font-semibold">${data.projectName}</span> (${data.fileCount} file)</p>
              <p><span class="text-zinc-400">Status:</span> <span class="text-sky-400 font-semibold">${data.readyState}</span></p>
              <div class="pt-1 flex flex-col gap-1.5">
                <a href="${data.productionUrl}" target="_blank" class="block text-center py-2 px-3 rounded-lg bg-emerald-500 text-zinc-950 font-bold hover:bg-emerald-400 transition">
                  🌐 Buka ${data.productionUrl}
                </a>
                <a href="${data.url}" target="_blank" class="block text-center py-1.5 px-3 rounded-lg bg-zinc-800 text-zinc-200 hover:bg-zinc-700 transition">
                  🔗 Preview URL (${data.deploymentId})
                </a>
              </div>
            </div>
            ${warnHtml}
          </div>
        `, 'success');
      } catch (err) {
        showStatus(`<p class="text-rose-400 font-semibold">❌ ${err.message}</p>`, 'error');
      } finally {
        deployBtn.disabled = false;
        deployBtn.innerHTML = '<span>🚀 Deploy Sekarang</span>';
      }
    });
  </script>
</body>
</html>
